openapi: 3.1.0
info:
  title: CTBX Payments BFF API
  version: 0.1.0-draft
  description: >-
    Contrato inicial do novo BFF. Não representa nem expõe o backend legado.
    Provedores, hosts e mecanismos criptográficos permanecem decisões internas.
servers:
  - url: https://api.example.invalid
    description: Placeholder documental; não é um endpoint utilizável
security:
  - bearerAuth: []
tags:
  - name: Auth
  - name: Accounts
  - name: Pix
  - name: Transfers
  - name: Payments
  - name: Cards
  - name: Security
paths:
  /v1/auth/login:
    post:
      tags: [Auth]
      security: []
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200': { $ref: '#/components/responses/AuthResponse' }
        '401': { $ref: '#/components/responses/ErrorResponse' }
  /v1/auth/refresh:
    post:
      tags: [Auth]
      security: []
      operationId: refreshSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string, writeOnly: true }
      responses:
        '200': { $ref: '#/components/responses/AuthResponse' }
        '401': { $ref: '#/components/responses/ErrorResponse' }
  /v1/auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      parameters: [{ $ref: '#/components/parameters/DeviceId' }]
      responses:
        '204': { description: Sessão revogada ou já encerrada }
        '401': { $ref: '#/components/responses/ErrorResponse' }
  /v1/auth/session:
    get:
      tags: [Auth]
      operationId: getSession
      parameters: [{ $ref: '#/components/parameters/DeviceId' }]
      responses:
        '200':
          description: Sessão atual
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionEnvelope' }
        '401': { $ref: '#/components/responses/ErrorResponse' }
  /v1/accounts/current:
    get:
      tags: [Accounts]
      operationId: getCurrentAccount
      parameters: [{ $ref: '#/components/parameters/DeviceId' }]
      responses:
        '200':
          description: Conta atual
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties: { data: { $ref: '#/components/schemas/Account' } }
        '401': { $ref: '#/components/responses/ErrorResponse' }
  /v1/accounts/current/balances:
    get:
      tags: [Accounts]
      operationId: getCurrentBalances
      parameters: [{ $ref: '#/components/parameters/DeviceId' }]
      responses:
        '200':
          description: Saldos normalizados
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties: { data: { $ref: '#/components/schemas/Balance' } }
        '401': { $ref: '#/components/responses/ErrorResponse' }
  /v1/accounts/current/statement:
    get:
      tags: [Accounts]
      operationId: listStatement
      parameters:
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/Cursor'
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: direction, in: query, schema: { type: string, enum: [CREDIT, DEBIT] } }
      responses:
        '200': { $ref: '#/components/responses/TransactionListResponse' }
        '401': { $ref: '#/components/responses/ErrorResponse' }
  /v1/accounts/current/statement/future:
    get:
      tags: [Accounts]
      operationId: listFutureTransactions
      parameters: [{ $ref: '#/components/parameters/DeviceId' }]
      responses:
        '200': { $ref: '#/components/responses/TransactionListResponse' }
        '401': { $ref: '#/components/responses/ErrorResponse' }
  /v1/accounts/current/statement/blocked:
    get:
      tags: [Accounts]
      operationId: listBlockedTransactions
      parameters: [{ $ref: '#/components/parameters/DeviceId' }]
      responses:
        '200': { $ref: '#/components/responses/TransactionListResponse' }
        '401': { $ref: '#/components/responses/ErrorResponse' }
  /v1/accounts/current/transactions/{id}:
    get:
      tags: [Accounts]
      operationId: getTransaction
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - $ref: '#/components/parameters/DeviceId'
      responses:
        '200':
          description: Transação
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties: { data: { $ref: '#/components/schemas/Transaction' } }
        '404': { $ref: '#/components/responses/ErrorResponse' }
        '401': { $ref: '#/components/responses/ErrorResponse' }
  /v1/accounts/current/transactions/{id}/receipt:
    get:
      tags: [Accounts]
      operationId: getTransactionReceipt
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - $ref: '#/components/parameters/DeviceId'
      responses:
        '200': { $ref: '#/components/responses/StatementReceiptResponse' }
        '404': { $ref: '#/components/responses/ErrorResponse' }
        '401': { $ref: '#/components/responses/ErrorResponse' }
  /v1/pix/keys/lookup:
    post:
      tags: [Pix]
      operationId: lookupPixKey
      parameters: [{ $ref: '#/components/parameters/DeviceId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key]
              properties:
                key: { type: string }
      responses:
        '200':
          description: Consulta fictícia de chave no SANDBOX
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties: { data: { $ref: '#/components/schemas/PixKeyLookup' } }
        '401': { $ref: '#/components/responses/ErrorResponse' }
        '404': { $ref: '#/components/responses/ErrorResponse' }
  /v1/pix/qr/lookup:
    post:
      tags: [Pix]
      operationId: lookupPixQr
      parameters: [{ $ref: '#/components/parameters/DeviceId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [payload]
              properties: { payload: { type: string } }
      responses:
        '200':
          description: Consulta fictícia de QR reconhecido no SANDBOX
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/PixQrLookup' }
        '400': { $ref: '#/components/responses/ErrorResponse' }
        '401': { $ref: '#/components/responses/ErrorResponse' }
  /v1/pix/keys:
    get:
      tags: [Pix]
      operationId: listPixKeys
      parameters: [{ $ref: '#/components/parameters/DeviceId' }]
      responses:
        '200':
          description: Chaves da conta
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/PixKey' }
        '401': { $ref: '#/components/responses/ErrorResponse' }
    post:
      tags: [Pix]
      operationId: createPixKey
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, value]
              properties:
                type: { type: string, enum: [CPF, CNPJ, EMAIL, PHONE, RANDOM] }
                value: { type: string }
      responses:
        '202': { $ref: '#/components/responses/OperationResponse' }
        '409': { $ref: '#/components/responses/ErrorResponse' }
  /v1/pix/keys/{id}:
    delete:
      tags: [Pix]
      operationId: deletePixKey
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202': { $ref: '#/components/responses/OperationResponse' }
        '404': { $ref: '#/components/responses/ErrorResponse' }
  /v1/pix/receive/qr:
    post:
      tags: [Pix]
      operationId: createReceivePixQr
      parameters: [{ $ref: '#/components/parameters/DeviceId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [keyId]
              properties:
                keyId: { type: string }
                amountMinor: { type: integer, minimum: 0, description: Valor opcional em centavos inteiros }
                description: { type: string, maxLength: 140 }
      responses:
        '200':
          description: QR de recebimento
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/PixReceiveQr' }
        '401': { $ref: '#/components/responses/ErrorResponse' }
        '404': { $ref: '#/components/responses/ErrorResponse' }
        '422': { $ref: '#/components/responses/ErrorResponse' }
  /v1/pix/transfers/validate:
    post:
      tags: [Pix]
      operationId: validatePixTransfer
      parameters: [{ $ref: '#/components/parameters/DeviceId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PixValidationIntent' }
      responses:
        '200':
          description: Intenção validada, sem efetivação
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties: { data: { $ref: '#/components/schemas/PixValidation' } }
        '401': { $ref: '#/components/responses/ErrorResponse' }
        '404': { $ref: '#/components/responses/ErrorResponse' }
        '422': { $ref: '#/components/responses/ErrorResponse' }
  /v1/pix/transfers:
    post:
      tags: [Pix]
      operationId: createPixTransfer
      parameters:
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PixSubmitIntent' }
      responses:
        '200': { $ref: '#/components/responses/PixTransferResponse' }
        '401': { $ref: '#/components/responses/ErrorResponse' }
        '404': { $ref: '#/components/responses/ErrorResponse' }
        '409': { $ref: '#/components/responses/ErrorResponse' }
        '422': { $ref: '#/components/responses/ErrorResponse' }
  /v1/pix/transfers/schedule:
    post:
      tags: [Pix]
      operationId: schedulePixTransfer
      parameters:
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/PixSubmitIntent'
                - type: object
                  required: [scheduledFor]
                  properties: { scheduledFor: { type: string, format: date-time } }
      responses:
        '200': { $ref: '#/components/responses/PixTransferResponse' }
        '401': { $ref: '#/components/responses/ErrorResponse' }
        '404': { $ref: '#/components/responses/ErrorResponse' }
        '409': { $ref: '#/components/responses/ErrorResponse' }
        '422': { $ref: '#/components/responses/ErrorResponse' }
  /v1/pix/transfers/{id}:
    get:
      tags: [Pix]
      operationId: getPixTransfer
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - $ref: '#/components/parameters/DeviceId'
      responses:
        '200': { $ref: '#/components/responses/PixTransferResponse' }
        '401': { $ref: '#/components/responses/ErrorResponse' }
        '404': { $ref: '#/components/responses/ErrorResponse' }
  /v1/pix/transfers/{id}/receipt:
    get:
      tags: [Pix]
      operationId: getPixReceipt
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - $ref: '#/components/parameters/DeviceId'
      responses:
        '200':
          description: Comprovante estrutural PIX SANDBOX
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties: { data: { $ref: '#/components/schemas/PixSandboxReceipt' } }
        '401': { $ref: '#/components/responses/ErrorResponse' }
        '404': { $ref: '#/components/responses/ErrorResponse' }
  /v1/transfers/banks:
    get:
      tags: [Transfers]
      operationId: listBanks
      parameters: [{ $ref: '#/components/parameters/DeviceId' }]
      responses:
        '200':
          description: Instituições disponíveis
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { type: array, items: { $ref: '#/components/schemas/Bank' } }
        '401': { $ref: '#/components/responses/ErrorResponse' }
  /v1/transfers/favorites:
    get:
      tags: [Transfers]
      operationId: listTransferFavorites
      parameters: [{ $ref: '#/components/parameters/DeviceId' }]
      responses:
        '200':
          description: Favorecidos
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { type: array, items: { $ref: '#/components/schemas/Beneficiary' } }
        '401': { $ref: '#/components/responses/ErrorResponse' }
  /v1/transfers/beneficiaries/lookup:
    post:
      tags: [Transfers]
      operationId: lookupTransferBeneficiary
      parameters: [{ $ref: '#/components/parameters/DeviceId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BeneficiaryLookup' }
      responses:
        '200':
          description: Beneficiário
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties: { data: { $ref: '#/components/schemas/Beneficiary' } }
        '400': { $ref: '#/components/responses/ErrorResponse' }
        '401': { $ref: '#/components/responses/ErrorResponse' }
        '404': { $ref: '#/components/responses/ErrorResponse' }
  /v1/transfers/validate:
    post:
      tags: [Transfers]
      operationId: validateBankTransfer
      parameters: [{ $ref: '#/components/parameters/DeviceId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BankTransferValidationIntent' }
      responses:
        '200':
          description: Validação sem efetivação
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties: { data: { $ref: '#/components/schemas/BankTransferValidation' } }
        '401': { $ref: '#/components/responses/ErrorResponse' }
        '404': { $ref: '#/components/responses/ErrorResponse' }
        '422': { $ref: '#/components/responses/ErrorResponse' }
  /v1/transfers:
    post:
      tags: [Transfers]
      operationId: createBankTransfer
      parameters:
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BankTransferSubmit' }
      responses:
        '200':
          description: Transferência exclusivamente simulada no SANDBOX
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties: { data: { $ref: '#/components/schemas/BankTransferSandbox' } }
        '401': { $ref: '#/components/responses/ErrorResponse' }
        '404': { $ref: '#/components/responses/ErrorResponse' }
        '409': { $ref: '#/components/responses/ErrorResponse' }
        '422': { $ref: '#/components/responses/ErrorResponse' }
  /v1/transfers/schedule:
    post:
      tags: [Transfers]
      operationId: scheduleBankTransfer
      parameters:
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/BankTransferSubmit'
                - type: object
                  required: [scheduledFor]
                  properties: { scheduledFor: { type: string, format: date-time } }
      responses:
        '200':
          description: Agendamento estrutural SANDBOX, sem executor posterior
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties: { data: { $ref: '#/components/schemas/BankTransferSandbox' } }
        '401': { $ref: '#/components/responses/ErrorResponse' }
        '404': { $ref: '#/components/responses/ErrorResponse' }
        '409': { $ref: '#/components/responses/ErrorResponse' }
        '422': { $ref: '#/components/responses/ErrorResponse' }
  /v1/transfers/{id}:
    get:
      tags: [Transfers]
      operationId: getBankTransfer
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - $ref: '#/components/parameters/DeviceId'
      responses:
        '200':
          description: Detalhe da transferência SANDBOX
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties: { data: { $ref: '#/components/schemas/BankTransferSandbox' } }
        '401': { $ref: '#/components/responses/ErrorResponse' }
        '404': { $ref: '#/components/responses/ErrorResponse' }
  /v1/transfers/{id}/receipt:
    get:
      tags: [Transfers]
      operationId: getBankTransferReceipt
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - $ref: '#/components/parameters/DeviceId'
      responses:
        '200':
          description: Comprovante estrutural SANDBOX, sem validade bancária
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties: { data: { $ref: '#/components/schemas/BankTransferSandboxReceipt' } }
        '401': { $ref: '#/components/responses/ErrorResponse' }
        '404': { $ref: '#/components/responses/ErrorResponse' }
  /v1/payments/bills/lookup:
    post:
      tags: [Payments]
      operationId: lookupBill
      parameters: [{ $ref: '#/components/parameters/DeviceId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties: { code: { type: string } }
      responses:
        '200':
          description: Boleto normalizado
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties: { data: { $ref: '#/components/schemas/Bill' } }
        '400': { $ref: '#/components/responses/ErrorResponse' }
        '401': { $ref: '#/components/responses/ErrorResponse' }
        '404': { $ref: '#/components/responses/ErrorResponse' }
  /v1/payments/bills/validate:
    post:
      tags: [Payments]
      operationId: validateBillPayment
      parameters: [{ $ref: '#/components/parameters/DeviceId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BillValidationIntent' }
      responses:
        '200':
          description: Validação sem pagamento
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties: { data: { $ref: '#/components/schemas/BillValidation' } }
        '401': { $ref: '#/components/responses/ErrorResponse' }
        '404': { $ref: '#/components/responses/ErrorResponse' }
        '422': { $ref: '#/components/responses/ErrorResponse' }
  /v1/payments/bills:
    post:
      tags: [Payments]
      operationId: payBill
      parameters:
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody: { $ref: '#/components/requestBodies/SandboxPaymentSubmit' }
      responses:
        '200': { $ref: '#/components/responses/PaymentResponse' }
        '401': { $ref: '#/components/responses/ErrorResponse' }
        '409': { $ref: '#/components/responses/ErrorResponse' }
        '422': { $ref: '#/components/responses/ErrorResponse' }
  /v1/payments/bills/schedule:
    post:
      tags: [Payments]
      operationId: scheduleBillPayment
      parameters:
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/SandboxPaymentSubmit'
                - type: object
                  required: [scheduledFor]
                  properties: { scheduledFor: { type: string, format: date-time } }
      responses:
        '200': { $ref: '#/components/responses/PaymentResponse' }
        '401': { $ref: '#/components/responses/ErrorResponse' }
        '409': { $ref: '#/components/responses/ErrorResponse' }
        '422': { $ref: '#/components/responses/ErrorResponse' }
  /v1/payments/{id}:
    get:
      tags: [Payments]
      operationId: getPayment
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - $ref: '#/components/parameters/DeviceId'
      responses:
        '200': { $ref: '#/components/responses/PaymentResponse' }
        '401': { $ref: '#/components/responses/ErrorResponse' }
        '404': { $ref: '#/components/responses/ErrorResponse' }
  /v1/payments/{id}/receipt:
    get:
      tags: [Payments]
      operationId: getPaymentReceipt
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - $ref: '#/components/parameters/DeviceId'
      responses:
        '200':
          description: Comprovante estrutural SANDBOX
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties: { data: { $ref: '#/components/schemas/SandboxPaymentReceipt' } }
        '401': { $ref: '#/components/responses/ErrorResponse' }
        '404': { $ref: '#/components/responses/ErrorResponse' }
  /v1/payments/installments/simulate:
    post:
      tags: [Payments]
      operationId: simulatePaymentInstallments
      parameters: [{ $ref: '#/components/parameters/DeviceId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [billId, amountMinor]
              properties:
                billId: { type: string }
                amountMinor: { type: integer, minimum: 1 }
                installments: { type: integer, minimum: 1, maximum: 12 }
      responses:
        '200':
          description: Opções calculadas pelo provider
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/SandboxInstallmentSimulation' }
        '401': { $ref: '#/components/responses/ErrorResponse' }
        '404': { $ref: '#/components/responses/ErrorResponse' }
        '422': { $ref: '#/components/responses/ErrorResponse' }
  /v1/payments/installments:
    post:
      tags: [Payments]
      operationId: createInstallmentPayment
      parameters:
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [simulationId, optionId, challengeId]
              properties:
                simulationId: { type: string }
                optionId: { type: string }
                challengeId: { type: string }
                description: { type: string }
      responses:
        '200': { $ref: '#/components/responses/PaymentResponse' }
        '401': { $ref: '#/components/responses/ErrorResponse' }
        '409': { $ref: '#/components/responses/ErrorResponse' }
        '422': { $ref: '#/components/responses/ErrorResponse' }
  /v1/cards:
    get:
      tags: [Cards]
      operationId: listCards
      parameters: [{ $ref: '#/components/parameters/DeviceId' }]
      responses:
        '200':
          description: Cartões autorizados para a conta
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties: { data: { type: array, items: { $ref: '#/components/schemas/Card' } } }
        '401': { $ref: '#/components/responses/ErrorResponse' }
  /v1/cards/{cardId}:
    get:
      tags: [Cards]
      operationId: getCard
      parameters:
        - { name: cardId, in: path, required: true, schema: { type: string } }
        - $ref: '#/components/parameters/DeviceId'
      responses:
        '200': { $ref: '#/components/responses/CardResponse' }
        '404': { $ref: '#/components/responses/ErrorResponse' }
        '401': { $ref: '#/components/responses/ErrorResponse' }
  /v1/cards/{id}/activation/challenge:
    post:
      tags: [Cards]
      operationId: createCardActivationChallenge
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - $ref: '#/components/parameters/DeviceId'
      responses:
        '201': { $ref: '#/components/responses/ChallengeResponse' }
  /v1/cards/{id}/activate:
    post:
      tags: [Cards]
      operationId: activateCard
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/DeviceId'
      requestBody: { $ref: '#/components/requestBodies/ChallengeProof' }
      responses:
        '200': { description: Ativação simulada SANDBOX, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } } }
  /v1/cards/{id}/block:
    post:
      tags: [Cards]
      operationId: blockCard
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/DeviceId'
      responses:
        '200': { description: Bloqueio simulado SANDBOX, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } } }
  /v1/cards/{id}/unblock:
    post:
      tags: [Cards]
      operationId: unblockCard
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/DeviceId'
      responses:
        '200': { description: Desbloqueio simulado SANDBOX, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } } }
  /v1/cards/{id}/password:
    post:
      tags: [Cards]
      operationId: changeCardPassword
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/DeviceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string, pattern: '^\d{4}$', writeOnly: true, description: Valor demonstrativo nunca persistido ou retornado }
      responses:
        '200': { description: Alteração exclusivamente simulada, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } } }
  /v1/cards/{cardId}/transactions:
    get:
      tags: [Cards]
      operationId: listCardTransactions
      parameters:
        - { name: cardId, in: path, required: true, schema: { type: string } }
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Transações do cartão
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { type: array, items: { $ref: '#/components/schemas/CardTransaction' } }
        '401': { $ref: '#/components/responses/ErrorResponse' }
  /v1/cards/{cardId}/transactions/{transactionId}:
    get:
      tags: [Cards]
      operationId: getCardTransaction
      parameters:
        - { name: cardId, in: path, required: true, schema: { type: string } }
        - { name: transactionId, in: path, required: true, schema: { type: string } }
        - $ref: '#/components/parameters/DeviceId'
      responses:
        '200':
          description: Detalhe da transação do cartão
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties: { data: { $ref: '#/components/schemas/CardTransaction' } }
        '401': { $ref: '#/components/responses/ErrorResponse' }
        '404': { $ref: '#/components/responses/ErrorResponse' }
  /v1/cards/{cardId}/receipts:
    get:
      tags: [Cards]
      operationId: listCardReceipts
      parameters:
        - { name: cardId, in: path, required: true, schema: { type: string } }
        - $ref: '#/components/parameters/DeviceId'
      responses:
        '200':
          description: Comprovantes disponíveis
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties: { data: { type: array, items: { $ref: '#/components/schemas/CardReceipt' } } }
        '401': { $ref: '#/components/responses/ErrorResponse' }
  /v1/cards/{cardId}/transactions/{transactionId}/receipt:
    get:
      tags: [Cards]
      operationId: getCardTransactionReceipt
      parameters:
        - { name: cardId, in: path, required: true, schema: { type: string } }
        - { name: transactionId, in: path, required: true, schema: { type: string } }
        - $ref: '#/components/parameters/DeviceId'
      responses:
        '200':
          description: Comprovante estrutural da transação do cartão
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties: { data: { $ref: '#/components/schemas/CardReceipt' } }
        '401': { $ref: '#/components/responses/ErrorResponse' }
        '404': { $ref: '#/components/responses/ErrorResponse' }
  /v1/transport-card:
    get:
      tags: [Cards]
      operationId: getTransportCard
      parameters: [{ $ref: '#/components/parameters/DeviceId' }]
      responses:
        '200': { $ref: '#/components/responses/CardResponse' }
        '401': { $ref: '#/components/responses/ErrorResponse' }
  /v1/cards/requests:
    post:
      tags: [Cards]
      operationId: requestCard
      parameters:
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [selectedColor, termsAccepted]
              properties:
                selectedColor: { type: string, enum: [Azul, Roxo, Preto] }
                termsAccepted: { type: boolean, enum: [true] }
      responses:
        '200': { description: Solicitação exclusivamente simulada, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } } }
  /v1/cards/{id}/recharge:
    post:
      tags: [Cards]
      operationId: rechargeCard
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/DeviceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amountMinor, currency]
              properties:
                amountMinor: { type: integer, minimum: 1, maximum: 100000 }
                currency: { type: string, enum: [BRL] }
      responses:
        '200': { description: Recarga financeira simulada, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } } }
  /v1/transport-card/recharge:
    post:
      tags: [Cards]
      operationId: rechargeTransportCard
      parameters:
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amountMinor, currency]
              properties:
                amountMinor: { type: integer, minimum: 1, maximum: 50000 }
                currency: { type: string, enum: [BRL] }
      responses:
        '200': { description: Recarga TOP exclusivamente simulada, content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } } }
  /v1/investments/products:
    get: { tags: [Investments], operationId: listInvestmentProducts, parameters: [{ $ref: '#/components/parameters/DeviceId' }], responses: { '200': { description: Produtos exclusivamente fictícios SANDBOX }, '401': { $ref: '#/components/responses/ErrorResponse' } } }
  /v1/investments/simulations:
    post: { tags: [Investments], operationId: simulateInvestment, parameters: [{ $ref: '#/components/parameters/DeviceId' }], responses: { '200': { description: Projeção matemática demonstrativa }, '422': { $ref: '#/components/responses/ErrorResponse' } } }
  /v1/investments/orders:
    post: { tags: [Investments], operationId: createInvestmentOrder, parameters: [{ $ref: '#/components/parameters/DeviceId' }, { $ref: '#/components/parameters/IdempotencyKey' }], responses: { '200': { description: Contratação simulada SANDBOX }, '409': { $ref: '#/components/responses/ErrorResponse' } } }
  /v1/investments/positions:
    get: { tags: [Investments], operationId: listInvestmentPositions, parameters: [{ $ref: '#/components/parameters/DeviceId' }], responses: { '200': { description: Posições derivadas das ordens em memória } } }
  /v1/investments/orders/{id}:
    get: { tags: [Investments], operationId: getInvestmentOrder, parameters: [{ $ref: '#/components/parameters/ResourceId' }, { $ref: '#/components/parameters/DeviceId' }], responses: { '200': { description: Ordem simulada }, '404': { $ref: '#/components/responses/ErrorResponse' } } }
  /v1/investments/orders/{id}/receipt:
    get: { tags: [Investments], operationId: getInvestmentReceipt, parameters: [{ $ref: '#/components/parameters/ResourceId' }, { $ref: '#/components/parameters/DeviceId' }], responses: { '200': { description: Comprovante estrutural SANDBOX } } }
  /v1/billing/payers:
    get: { tags: [Billing], operationId: listBillingPayers, parameters: [{ $ref: '#/components/parameters/DeviceId' }], responses: { '200': { description: Sacados fictícios mascarados } } }
    post: { tags: [Billing], operationId: createBillingPayer, parameters: [{ $ref: '#/components/parameters/DeviceId' }, { $ref: '#/components/parameters/IdempotencyKey' }], responses: { '200': { description: Sacado fictício criado em memória } } }
  /v1/billing/payers/{id}:
    put: { tags: [Billing], operationId: updateBillingPayer, parameters: [{ $ref: '#/components/parameters/ResourceId' }, { $ref: '#/components/parameters/DeviceId' }], responses: { '200': { description: Sacado fictício atualizado em memória }, '404': { $ref: '#/components/responses/ErrorResponse' } } }
    delete: { tags: [Billing], operationId: deleteBillingPayer, parameters: [{ $ref: '#/components/parameters/ResourceId' }, { $ref: '#/components/parameters/DeviceId' }], responses: { '200': { description: Sacado fictício removido da memória }, '404': { $ref: '#/components/responses/ErrorResponse' } } }
  /v1/billing/limits:
    get: { tags: [Billing], operationId: getBillingLimits, parameters: [{ $ref: '#/components/parameters/DeviceId' }], responses: { '200': { description: Limite demonstrativo de quantidade } } }
  /v1/billing/bills:
    get: { tags: [Billing], operationId: listBillingBills, parameters: [{ $ref: '#/components/parameters/DeviceId' }], responses: { '200': { description: Cobranças SANDBOX } } }
    post: { tags: [Billing], operationId: issueBillingBill, parameters: [{ $ref: '#/components/parameters/DeviceId' }, { $ref: '#/components/parameters/IdempotencyKey' }], responses: { '200': { description: Cobrança estrutural não bancária }, '409': { $ref: '#/components/responses/ErrorResponse' } } }
  /v1/billing/bills/{id}:
    get: { tags: [Billing], operationId: getBillingBill, parameters: [{ $ref: '#/components/parameters/ResourceId' }, { $ref: '#/components/parameters/DeviceId' }], responses: { '200': { description: Cobrança SANDBOX } } }
  /v1/billing/bills/{id}/receipt:
    get: { tags: [Billing], operationId: getBillingReceipt, parameters: [{ $ref: '#/components/parameters/ResourceId' }, { $ref: '#/components/parameters/DeviceId' }], responses: { '200': { description: Não é boleto bancário real } } }
  /v1/billing/bills/{id}/share:
    post: { tags: [Billing], operationId: shareBillingBill, parameters: [{ $ref: '#/components/parameters/ResourceId' }, { $ref: '#/components/parameters/DeviceId' }], responses: { '200': { description: Compartilhamento apenas simulado no canal SANDBOX } } }
  /v1/consigned/products:
    get: { tags: [Consigned], operationId: listConsignedProducts, parameters: [{ $ref: '#/components/parameters/DeviceId' }], responses: { '200': { description: Produtos fictícios sem elegibilidade real } } }
  /v1/consigned/products/{id}/documents:
    get: { tags: [Consigned], operationId: getConsignedDocuments, parameters: [{ $ref: '#/components/parameters/ResourceId' }, { $ref: '#/components/parameters/DeviceId' }], responses: { '200': { description: Checklist estrutural sem upload de documentos reais } } }
  /v1/consigned/products/{id}/terms:
    get: { tags: [Consigned], operationId: getConsignedTerms, parameters: [{ $ref: '#/components/parameters/ResourceId' }, { $ref: '#/components/parameters/DeviceId' }], responses: { '200': { description: Termos exclusivamente simulados } } }
  /v1/consigned/applications:
    get: { tags: [Consigned], operationId: listConsignedApplications, parameters: [{ $ref: '#/components/parameters/DeviceId' }], responses: { '200': { description: Solicitações SANDBOX } } }
    post: { tags: [Consigned], operationId: createConsignedApplication, parameters: [{ $ref: '#/components/parameters/DeviceId' }, { $ref: '#/components/parameters/IdempotencyKey' }], responses: { '200': { description: Solicitação simulada em análise }, '409': { $ref: '#/components/responses/ErrorResponse' } } }
  /v1/consigned/applications/{id}:
    get: { tags: [Consigned], operationId: getConsignedApplication, parameters: [{ $ref: '#/components/parameters/ResourceId' }, { $ref: '#/components/parameters/DeviceId' }], responses: { '200': { description: Status SANDBOX } } }
  /v1/consigned/applications/{id}/receipt:
    get: { tags: [Consigned], operationId: getConsignedReceipt, parameters: [{ $ref: '#/components/parameters/ResourceId' }, { $ref: '#/components/parameters/DeviceId' }], responses: { '200': { description: Comprovante de solicitação simulada } } }
  /v1/security/challenges:
    post:
      tags: [Security]
      operationId: createChallenge
      parameters: [{ $ref: '#/components/parameters/DeviceId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [purpose, operationId]
              properties:
                purpose: { type: string }
                operationId: { type: string }
                type: { type: string, enum: [OTP] }
      responses:
        '201': { $ref: '#/components/responses/ChallengeResponse' }
        '401': { $ref: '#/components/responses/ErrorResponse' }
  /v1/security/challenges/{id}/verify:
    post:
      tags: [Security]
      operationId: verifyChallenge
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - $ref: '#/components/parameters/DeviceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [proof]
              properties: { proof: { type: string, writeOnly: true } }
      responses:
        '200': { $ref: '#/components/responses/ChallengeResponse' }
        '401': { $ref: '#/components/responses/ErrorResponse' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque-or-jwt
  parameters:
    ResourceId:
      name: id
      in: path
      required: true
      schema: { type: string }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 16, maxLength: 128 }
    DeviceId:
      name: X-Device-Id
      in: header
      required: true
      description: Identificador opaco devolvido no login e vinculado à sessão.
      schema: { type: string, minLength: 8, maxLength: 128 }
  requestBodies:
    PixTransferIntent:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/PixTransferIntent' }
    BankTransferIntent:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/BankTransferIntent' }
    SandboxPaymentSubmit:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/SandboxPaymentSubmit' }
    BillPaymentIntent:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/BillValidationIntent' }
    ChallengeProof:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [challengeId]
            properties: { challengeId: { type: string } }
  responses:
    ErrorResponse:
      description: Erro normalizado
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    AuthResponse:
      description: Resultado de autenticação, inclusive estados intermediários
      content:
        application/json:
          schema: { $ref: '#/components/schemas/AuthEnvelope' }
    TransactionListResponse:
      description: Lista paginada de transações
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/SuccessEnvelope'
              - type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Transaction' } }
                  meta: { $ref: '#/components/schemas/PageMeta' }
    ReceiptResponse:
      description: Comprovante autorizado
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/SuccessEnvelope'
              - type: object
                properties: { data: { $ref: '#/components/schemas/Receipt' } }
    StatementReceiptResponse:
      description: Comprovante estrutural de movimentação da conta
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/SuccessEnvelope'
              - type: object
                properties: { data: { $ref: '#/components/schemas/StatementReceipt' } }
    OperationResponse:
      description: Operação aceita ou consultada
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/SuccessEnvelope'
              - type: object
                properties: { data: { $ref: '#/components/schemas/Operation' } }
    PixTransferResponse:
      description: Transferência PIX
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/SuccessEnvelope'
              - type: object
                properties: { data: { $ref: '#/components/schemas/PixTransfer' } }
    BankTransferResponse:
      description: Transferência bancária
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/SuccessEnvelope'
              - type: object
                properties: { data: { $ref: '#/components/schemas/BankTransfer' } }
    PaymentResponse:
      description: Pagamento
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/SuccessEnvelope'
              - type: object
                properties: { data: { $ref: '#/components/schemas/Payment' } }
    CardResponse:
      description: Cartão
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/SuccessEnvelope'
              - type: object
                properties: { data: { $ref: '#/components/schemas/Card' } }
    ChallengeResponse:
      description: Challenge sem segredo
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/SuccessEnvelope'
              - type: object
                properties: { data: { $ref: '#/components/schemas/Challenge' } }
  schemas:
    SuccessEnvelope:
      type: object
      required: [data, requestId]
      properties:
        data: {}
        meta: { type: object, additionalProperties: true }
        requestId: { type: string }
    ErrorEnvelope:
      type: object
      required: [error, requestId]
      properties:
        error: { $ref: '#/components/schemas/ApiError' }
        requestId: { type: string }
    ApiError:
      type: object
      required: [code, message, retryable]
      properties:
        code: { type: string }
        message: { type: string }
        retryable: { type: boolean }
        fieldErrors:
          type: array
          items:
            type: object
            required: [field, code]
            properties:
              field: { type: string }
              code: { type: string }
    Money:
      type: object
      required: [amount, currency]
      properties:
        amount: { type: integer, description: Menor unidade da moeda }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
    OperationStatus:
      type: string
      enum: [PENDING, PROCESSING, REQUIRES_ACTION, SCHEDULED, COMPLETED, FAILED, UNDER_REVIEW, CANCELLED]
    Operation:
      type: object
      required: [id, operationId, status, createdAt]
      properties:
        id: { type: string }
        operationId: { type: string }
        status: { $ref: '#/components/schemas/OperationStatus' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        nextAction: { $ref: '#/components/schemas/NextAction' }
    NextAction:
      type: object
      required: [type]
      properties:
        type: { type: string, enum: [SELECT_ACCOUNT, COMPLETE_REGISTRATION, CHANGE_PASSWORD, VERIFY_CHALLENGE, WAIT, CONTACT_SUPPORT] }
        resourceId: { type: string }
    LoginRequest:
      type: object
      required: [username, password, device]
      properties:
        username: { type: string }
        password: { type: string, writeOnly: true }
        device: { $ref: '#/components/schemas/DeviceRegistration' }
    DeviceRegistration:
      type: object
      required: [installationId, platform]
      properties:
        installationId: { type: string }
        name: { type: string }
        platform: { type: string, enum: [ANDROID, IOS] }
        appVersion: { type: string }
    AuthState:
      type: string
      enum: [AUTHENTICATED, ACCOUNT_SELECTION_REQUIRED, ACCOUNT_UNDER_REVIEW, FIRST_ACCESS_REQUIRED, REGISTRATION_INCOMPLETE, PASSWORD_CHANGE_REQUIRED, CHALLENGE_REQUIRED, ACCOUNT_BLOCKED]
    AuthEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              type: object
              required: [state, sessionId, accessToken, refreshToken, expiresAt, deviceId, environment, user, account]
              properties:
                state: { $ref: '#/components/schemas/AuthState' }
                sessionId: { type: string }
                accessToken: { type: string }
                refreshToken: { type: string }
                expiresAt: { type: string, format: date-time }
                deviceId: { type: string }
                environment: { type: string, enum: [sandbox] }
                user: { $ref: '#/components/schemas/User' }
                account: { $ref: '#/components/schemas/Account' }
                availableAccounts: { type: array, items: { $ref: '#/components/schemas/Account' } }
                nextAction: { $ref: '#/components/schemas/NextAction' }
    SessionEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              type: object
              required: [user, account, session]
              properties:
                user: { $ref: '#/components/schemas/User' }
                account: { $ref: '#/components/schemas/Account' }
                session:
                  type: object
                  required: [id, deviceId, expiresAt, environment]
                  properties:
                    id: { type: string }
                    deviceId: { type: string }
                    expiresAt: { type: string, format: date-time }
                    environment: { type: string, enum: [sandbox] }
    User:
      type: object
      required: [id, type, displayName]
      properties:
        id: { type: string }
        type: { type: string, enum: [PF, PJ_REPRESENTATIVE] }
        displayName: { type: string }
        maskedDocument: { type: string }
        maskedEmail: { type: string }
        maskedPhone: { type: string }
    Account:
      type: object
      required: [id, type, status]
      properties:
        id: { type: string }
        type: { type: string, enum: [PERSONAL, BUSINESS] }
        accountType: { type: string, enum: [CHECKING] }
        currency: { type: string, enum: [BRL] }
        status: { type: string, enum: [ACTIVE, UNDER_REVIEW, INCOMPLETE, BLOCKED, CLOSED] }
